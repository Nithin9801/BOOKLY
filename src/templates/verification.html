<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Verification</title>
</head>

<body style="margin:0;padding:0;background:#eef2ff;font-family:Segoe UI,Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td align="center" style="padding:50px 20px;">

<table width="600" cellpadding="0" cellspacing="0" border="0"
style="
max-width:600px;
background:rgba(255,255,255,0.75);
border:1px solid rgba(255,255,255,.6);
border-radius:24px;
box-shadow:0 20px 50px rgba(0,0,0,.08);
backdrop-filter:blur(12px);
">

<tr>
<td style="padding:45px;">

<div style="text-align:center;">

<div style="
width:72px;
height:72px;
margin:auto;
border-radius:20px;
background:linear-gradient(135deg,#6366F1,#8B5CF6);
font-size:34px;
line-height:72px;
color:white;
font-weight:bold;
">
✓
</div>

<h1 style="
margin:30px 0 10px;
font-size:32px;
color:#111827;
font-weight:700;
">
Verify Your Email
</h1>

<p style="
font-size:16px;
line-height:28px;
color:#6B7280;
margin:0 auto 35px;
max-width:430px;
">
Welcome! Use the verification code below to complete your signup.
This code expires in <b>10 minutes</b>.
</p>

<a href="{{ verification_url }}"
   style="
      display:inline-block;
      padding:14px 28px;
      background:#6366F1;
      color:#ffffff;
      text-decoration:none;
      border-radius:12px;
      font-weight:600;
      font-size:16px;
   ">
   Verify Your Email
</a>

<p style="
font-size:14px;
color:#6B7280;
line-height:24px;
margin-top:0;
">
If you didn't request this verification,
you can safely ignore this email.
</p>

<hr style="
border:none;
height:1px;
background:#E5E7EB;
margin:35px 0;
">

<p style="
font-size:13px;
color:#9CA3AF;
line-height:22px;
margin:0;
">
Sent with ❤️ by <strong>Bookly App</strong><br>
This is an automated email. Please do not reply.
</p>

</div>

</td>
</tr>

</table>

</td>
</tr>
</table>

</body>
</html>
